name: AVENTRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aventra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aventra:aventra_test_password@localhost:5432/aventra_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aventra
          POSTGRES_PASSWORD: aventra_test_password
          POSTGRES_DB: aventra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aventra -d aventra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run tests
        run: npm test
